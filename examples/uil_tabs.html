<!DOCTYPE html>
<html lang="es">
  <head>
    <title>UIL – TreeList demo</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link rel="shortcut icon" href="./assets/favicon.ico" />
    <style>
      html {
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      body {
        font-family: "Lucida Console", Monaco, monospace;
        background-color: #2f3340;
        font-size: 11px;
        color: #fff;
        margin: 0;
      }
      #log {
        white-space: pre;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div id="log"></div>

    <script type="module">
      import * as UIL from "../build/uil.module.js";

      let params = {
        applyJSON: false,
        currentModel: "cloud03.glb",
        currentCamera: "drone",
        speed: 0.34,
        speedMapped: 2.4,
        fov: 45,
        focalDistance: 1500,
        focalRange: 2000,
        opacity: 1.5,
        size: 2.5,
        dof: 2,
        decay: 0.3,
        gamma: 1.1,
        bloom: 1.5,
        linear: 10,
        easein: 10,
        easeout: 10,
        listen: 0,
        axis: "x",
      };

      // Árbol de ejemplo
      const tree = {
        Animales: {
          Aves: ["Gorrión", "Águila", "Colibrí"],
          Mamíferos: ["Perro", "Gato", "Delfín", "Elefante"],
        },
        Vehículos: ["Auto", "Bicicleta", "Avión", "Barco"],
        Colores: {
          Cálidos: ["Rojo", "Naranja", "Amarillo"],
          Fríos: ["Azul", "Verde", "Violeta"],
          Neutros: ["Blanco", "Negro", "Gris"],
        },
      };

      // Objeto de estado EXTERNO a la UI (fuente de verdad)
      const state = {
        path: ["Animales", "Aves"], // estado inicial que debe seguir el TreeList
      };

      const ui = new UIL.Gui({
        w: 128 * 3,
        open: true,
        isCanvas: true,
        addDOMEventListeners: true,
        parent: document.body,
      });
      const tabs = ui.add("tabs", {
        tabs: ["General", "Avanzado", "Debug"],
        active: 0,
      });

      tabs.add("slide", {
        name: "total",
        min: 0,
        max: 100,
        open: true,
        tab: "General",
      });
      tabs.add("slide", {
        name: "amount",
        min: 0,
        max: 10,
        value: 5,
        open: true,
        tab: "General",
      });
      tabs.add("slide", {
        name: "tune",
        min: -2,
        max: 2,
        open: true,
        tab: "Avanzado",
      });

      // Agregar a un tab por ÍNDICE:
      tabs.add("slide", {
        name: "power",
        min: 0,
        max: 20,
        open: true,
        value: 6.2,
        tabIndex: 2,
      });

      let gPart = tabs.add("group", {
        name: "Group1",
        bg: "#994466",
        tabIndex: 1,
        decal: 0,
      });

      gPart.add(params, "opacity", {
        type: "slide",
        displayName: "opacity",
        min: 0,
        max: 10,
        step: 0.01,
      });
      gPart.add(params, "size", {
        type: "slide",
        displayName: "size",
        min: 0,
        max: 10,
        step: 0.01,
      });
      gPart.add(params, "dof", {
        type: "slide",
        displayName: "DOF size multiplier",
        min: 0,
        max: 5,
        step: 0.01,
      });
      gPart.add(params, "decay", {
        type: "slide",
        displayName: "DOF opacity decay",
        min: 0,
        max: 5,
        step: 0.01,
      });
      gPart.open();

      tabs.add("slide", {
        name: "delay",
        min: 0,
        max: 20,
        open: true,
        value: 6.2,
        tabIndex: 1,
      });

      let gCloud = tabs.add("group", {
        name: "Cloud Model",
        bg: "#446666",
        tabIndex: 0,
        decal: 0,
      });

      gCloud.add(params, "currentModel", {
        type: "list",
        displayName: "Model",
        list: ["cloud1.glb", "cloud2.glb", "cloud3.glb"],
      });

      gCloud.add("button", {
        name: "",
        value: ["Load Model"],
        callback: (name) => {
          console.log(name);
        },
      });
      gCloud.add("button", {
        name: "",
        value: ["Load Prev Model", "Load Next Model"],
        callback: (name) => {
          console.log(name);
        },
      });
      gCloud.add(params, "totalParticles", {
        type: "list",
        displayName: "total particles",
        list: ["250K", "500K", "1M", "2M"],
      });
      gCloud.open();

      tabs.add(params, "gamma", {
        type: "slide",
        displayName: "gamma",
        min: 0,
        max: 2,
        step: 0.01,
        tabIndex: 2,
      });
      tabs.add(params, "saturation", {
        type: "slide",
        displayName: "saturation",
        min: 0,
        max: 2,
        step: 0.01,
        tabIndex: 2,
      });
      tabs.add(params, "hdrHigh", {
        type: "slide",
        displayName: "HDR high",
        min: 0,
        max: 1,
        step: 0.01,
        tabIndex: 2,
      });
      tabs.add(params, "hdrLow", {
        type: "slide",
        displayName: "HDR low",
        min: 0,
        max: 1,
        step: 0.01,
        tabIndex: 2,
      });
      tabs.add(params, "brightness", {
        type: "slide",
        displayName: "brightness",
        min: 0,
        max: 1,
        step: 0.01,
        tabIndex: 2,
      });

      /*
    const g = ui.add('group', { name: 'TreeList Demo', bg: '#446666' });

    // MODO REFERENCIA: (objeto, 'propiedad', { type:'treelist', ... })

      // (opcional) cualquier otro parámetro tuyo, por ej. focus inicial:

      tabIndex: 1,
      itemIndex: 7,
      enableHover:false
      //onChange: (tabIndex, itemIndex, newPath) => {
        // newPath ya se envió a state.path vía this.send(newPath), pero dejamos log
        //log(`onChange(tab=${tabIndex}, item=${itemIndex})\nnewPath = ${JSON.stringify(newPath)}`);
      //}
    })//.listen(); // <- activa el seguimiento de cambios externos en state.path  :contentReference[oaicite:5]{index=5}




    //document.body.appendChild(ui.canvas);
    function log(msg){ document.getElementById('log').textContent = msg; }
    g.open();
*/
      function onClickSetState1() {
        state.path = ["Colores", "Fríos"];
      }

      // create button on the DOM
      /*
    const button = document.createElement('button');
    button.textContent = 'Set State to Colores/Fríos';
    button.onclick = onClickSetState1;
    document.body.appendChild(button);
*/
    </script>
  </body>
</html>
