<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Uil Tabs Example</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link rel="shortcut icon" href="./assets/favicon.ico">
    </head>
<style>
html{ overflow:hidden; width:100%; height:100%; }
body { font-family: "Lucida Console", Monaco, monospace; background-color:#717b84; font-size:11px; color:#fff; margin: 0px; }
</style>
</head>
<body>
<div id='content'></div>
<script type="module">

import {UIL} from '../src/Uil_dev.js';

let ui;

let params={
    applyJSON:false,
    currentModel:"cloud03.glb",
    currentCamera:"drone",
    speed:0.34,
    speedMapped:2.4,
    fov:45,
    focalDistance:1500,
    focalRange:2000,
    particleOpacity:1.5,
    particleSize:2.5,
    particleDOFSizeMultiplier:2,
    particleDOFOpacityDecay:0.3,
    gamma:1.1,
    bloom:1.5,
    linear:10,
    easein:10,
    easeout:10,
}

window.params=params;

function initGUI () {

    ui = new UIL.Gui({w:128*4,isCanvas:false,addDOMEventListeners:true});

    let tabModel = ui.add("tab",{name:"Model",bg:"#446666"});
    let gCloud = tabModel.add("group",{name:"Cloud Model",bg:"#446666"});
    gCloud.add(params,"currentModel",{type:"list",displayName:"Model",list:["cloud1.glb","cloud2.glb","cloud3.glb"]});
    gCloud.add("button",{name:"",value:["Load Model"],callback:(name)=>{console.log(name)}});
    gCloud.add("button",{name:"",value:["Load Prev Model","Load Next Model"],callback:(name)=>{console.log(name)}});
    gCloud.add(params,"totalParticles",{type:"list",displayName:"total particles",list:["250K","500K","1M","2M"]});
    gCloud.open();

    let gJson = tabModel.add("group",{name:"JSON Editor",bg:"#666644"});
    gJson.add(params,"applyJSON",{displayName:"apply JSON settings",callback:(name)=>{console.log(name)}});
    gJson.add("button",{name:"Load cam initial state",value:["Orbital","Drone"],callback:(name)=>{console.log(name)}});
    gJson.open();

    let tabCam = ui.add("tab",{name:"Camera",bg:"#664444"});
    let gCam = tabCam.add("group",{name:"Camera",bg:"#664444"});
    gCam.add(params,"currentCamera",{type:"list",list:["orbital","drone"]});
    let o1=gCam.add(params,"fov",{displayName:"FOV",min:0,max:90,step:0.01});
    gCam.add(params,"focalDistance",{type:"slide",displayName:"focal distance",min:0,max:9000,step:0.01});
    gCam.add(params,"focalRange",{type:"slide",displayName:"focal range",min:0,max:9000,step:0.01});
    gCam.open();

    let tabRender = ui.add("tab",{name:"Render",bg:"#444466"});
    let gPart = tabRender.add("group",{name:"Particles",bg:"#444466"});
    gPart.add(params,"particleOpacity",{type:"slide",displayName:"opacity",min:0,max:10,step:0.01});
    gPart.add(params,"particleSize",{type:"slide",displayName:"size",min:0,max:10,step:0.01});
    gPart.add(params,"particleDOFSizeMultiplier",{type:"slide",displayName:"DOF size multiplier",min:0,max:5,step:0.01});
    gPart.add(params,"particleDOFOpacityDecay",{type:"slide",displayName:"DOF opacity decay",min:0,max:5,step:0.01});
    gPart.open();

    let gRender = tabRender.add("group",{name:"Rendering",bg:"#446644"});
    gRender.add(params,"gamma",{type:"slide",displayName:"gamma",min:0,max:2,step:0.01});
    gRender.add(params,"saturation",{type:"slide",displayName:"saturation",min:0,max:2,step:0.01});
    gRender.add(params,"hdrHigh",{type:"slide",displayName:"HDR high",min:0,max:1,step:0.01});
    gRender.add(params,"hdrLow",{type:"slide",displayName:"HDR low",min:0,max:1,step:0.01});
    gRender.add(params,"brightness",{type:"slide",displayName:"brightness",min:0,max:1,step:0.01});
    gRender.add(params,"bloom",{type:"slide",displayName:"bloom",min:0,max:10,step:0.01}).listen();
    gRender.open();

    let gTest = tabRender.add("group",{name:"Test"});
    gTest.open();
    gTest.add(params,"linear",{type:"slide",displayName:"linear",min:0,max:20,easing:1,precision:4}).listen();
    gTest.add(params,"easein",{type:"slide",displayName:"easein",min:0,max:20,easing:5,precision:4}).listen();
    gTest.add(params,"easeout",{type:"slide",displayName:"easeout",min:0,max:20,easing:0.2,precision:4}).listen();

    // test item removal
    gCam.remove(o1);
    o1=gCam.add(params,"fov",{displayName:"FOV",min:20,max:30,step:0.1});
}

initGUI();

</script>
</body>
</html>
